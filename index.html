<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anu - Intranet</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        .logo {
            font-size: 48px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 4px;
            margin-bottom: 10px;
        }

        .tagline {
            color: #94a3b8;
            font-size: 14px;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .links-section {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #e2e8f0;
        }

        .add-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .link-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 25px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .link-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .link-card:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .link-card:hover::before {
            opacity: 1;
        }

        .link-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .link-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .link-actions {
            display: flex;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .link-card:hover .link-actions {
            opacity: 1;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #94a3b8;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .action-btn.delete:hover {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .link-name {
            font-size: 18px;
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 8px;
        }

        .link-url {
            color: #64748b;
            font-size: 13px;
            word-break: break-all;
            margin-bottom: 15px;
        }

        .open-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(102, 126, 234, 0.15);
            color: #667eea;
            padding: 10px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .open-btn:hover {
            background: rgba(102, 126, 234, 0.25);
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #1e293b;
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 450px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #94a3b8;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            border-color: #667eea;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .modal-btn {
            flex: 1;
            padding: 14px;
            border-radius: 10px;
            border: none;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-btn.cancel {
            background: rgba(255, 255, 255, 0.1);
            color: #94a3b8;
        }

        .modal-btn.cancel:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .modal-btn.save {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .modal-btn.save:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        footer {
            text-align: center;
            margin-top: 50px;
            color: #475569;
            font-size: 13px;
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #10b981;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            z-index: 2000;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .info-text {
            text-align: center;
            color: #64748b;
            font-size: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">ANU</div>
            <div class="tagline">Internal Portal</div>
        </header>

        <div class="links-section">
            <div class="section-header">
                <span class="section-title">Quick Links</span>
                <button class="add-btn" onclick="openModal()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    Add Link
                </button>
            </div>
            <div class="links-grid" id="linksGrid">
                <!-- Links will be rendered here -->
            </div>
            <p class="info-text">Links are saved in your browser (localStorage). Each device has its own links.</p>
        </div>

        <footer>
            Anu Intranet &copy; 2026
        </footer>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h3 class="modal-title" id="modalTitle">Add New Link</h3>
            <div class="form-group">
                <label>Name</label>
                <input type="text" id="linkName" placeholder="e.g., disposal sheet">
            </div>
            <div class="form-group">
                <label>URL</label>
                <input type="url" id="linkUrl" placeholder="https://...">
            </div>
            <div class="modal-actions">
                <button class="modal-btn cancel" onclick="closeModal()">Cancel</button>
                <button class="modal-btn save" onclick="saveLink()">Save</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script src="links-lib.js"></script>
    <script>
        const { escapeHtml, safeUrl, parseLinks } = AnuLinks;

        // Default links
        const defaultLinks = [
            {
                id: 1,
                name: 'disposal sheet',
                url: 'https://docs.google.com/spreadsheets/d/1FAj97HJZcYzsi0AmlWA0HtZNw9G_En9E6F6kaysgacQ/edit?hl=ja&gid=263692830#gid=263692830',
                icon: '📊'
            }
        ];

        function loadLinks() {
            try {
                return parseLinks(localStorage.getItem('anu-links'), defaultLinks);
            } catch (e) {
                return defaultLinks; // 保存場所が使えない時も、画面は動かす
            }
        }

        let links = loadLinks();
        let editingId = null;

        // 成功したら true。失敗（容量いっぱい・保存禁止など）は false を返し、呼び出し側が知らせる
        function saveToStorage() {
            try {
                localStorage.setItem('anu-links', JSON.stringify(links));
                return true;
            } catch (e) {
                return false;
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function getIcon(url) {
            if (url.includes('google.com/spreadsheets')) return '📊';
            if (url.includes('google.com/document')) return '📄';
            if (url.includes('google.com/presentation')) return '📽️';
            if (url.includes('drive.google.com')) return '📁';
            if (url.includes('github.com')) return '💻';
            if (url.includes('slack.com')) return '💬';
            if (url.includes('notion.')) return '📝';
            if (url.includes('figma.')) return '🎨';
            return '🔗';
        }

        function renderLinks() {
            const grid = document.getElementById('linksGrid');

            if (links.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101"/>
                            <path d="M10.172 13.828a4 4 0 015.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
                        </svg>
                        <p>No links yet. Click "Add Link" to get started.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = links.map(link => {
                const href = safeUrl(link.url);
                return `
                <div class="link-card">
                    <div class="link-header">
                        <div class="link-icon">${escapeHtml(link.icon || getIcon(link.url))}</div>
                        <div class="link-actions">
                            <button class="action-btn" onclick="editLink(${link.id})" title="Edit">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
                                    <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
                                </svg>
                            </button>
                            <button class="action-btn delete" onclick="deleteLink(${link.id})" title="Delete">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="3 6 5 6 21 6"/>
                                    <path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="link-name">${escapeHtml(link.name)}</div>
                    <div class="link-url">${escapeHtml(link.url.length > 50 ? link.url.substring(0, 50) + '...' : link.url)}</div>
                    <a href="${href ? escapeHtml(href) : '#'}" target="_blank" rel="noopener noreferrer" class="open-btn">
                        Open
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/>
                            <polyline points="15 3 21 3 21 9"/>
                            <line x1="10" y1="14" x2="21" y2="3"/>
                        </svg>
                    </a>
                </div>
            `;
            }).join('');
        }

        function openModal(id = null) {
            editingId = id;
            const modal = document.getElementById('modalOverlay');
            const title = document.getElementById('modalTitle');
            const nameInput = document.getElementById('linkName');
            const urlInput = document.getElementById('linkUrl');

            if (id) {
                const link = links.find(l => l.id === id);
                title.textContent = 'Edit Link';
                nameInput.value = link.name;
                urlInput.value = link.url;
            } else {
                title.textContent = 'Add New Link';
                nameInput.value = '';
                urlInput.value = '';
            }

            modal.classList.add('active');
            nameInput.focus();
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            editingId = null;
        }

        function saveLink() {
            const name = document.getElementById('linkName').value.trim();
            const url = document.getElementById('linkUrl').value.trim();

            if (!name || !url) {
                alert('Please fill in all fields');
                return;
            }

            const okUrl = safeUrl(url);
            if (!okUrl) {
                alert('URL must start with http:// or https://');
                return;
            }

            const before = links;
            if (editingId) {
                links = links.map(l => l.id === editingId
                    ? { ...l, name, url: okUrl, icon: getIcon(okUrl) }
                    : l);
            } else {
                let id = Date.now();
                while (links.some(l => l.id === id)) id++; // 同じ番号を作らない
                links = [...links, { id, name, url: okUrl, icon: getIcon(okUrl) }];
            }

            if (saveToStorage()) {
                showToast(editingId ? 'Link updated!' : 'Link added!');
            } else {
                links = before; // 保存できなかったら、できたふりをしない
                showToast('Could not save (browser storage is full or blocked)');
            }
            renderLinks();
            closeModal();
        }

        function editLink(id) {
            openModal(id);
        }

        function deleteLink(id) {
            if (confirm('Delete this link?')) {
                const before = links;
                links = links.filter(l => l.id !== id);
                if (saveToStorage()) {
                    showToast('Link deleted');
                } else {
                    links = before;
                    showToast('Could not save (browser storage is full or blocked)');
                }
                renderLinks();
            }
        }

        // Close modal on outside click
        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target.id === 'modalOverlay') {
                closeModal();
            }
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
            // 入力欄で Enter を押した時だけ保存（Cancel/Save ボタン上の Enter で二重に動かない）
            if (e.key === 'Enter' && e.target.tagName === 'INPUT' && document.getElementById('modalOverlay').classList.contains('active')) {
                saveLink();
            }
        });

        // Initial render
        renderLinks();
    </script>
</body>
</html>
